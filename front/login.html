<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Monitorias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card shadow" style="width: 100%; max-width: 500px;">
        <div class="card-body p-5">
            <h3 class="text-center mb-4">Entrar no SMU</h3>
            
            <form id="form-login">
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="text" class="form-control" id="email" required>
                </div>
                
                <div class="mb-4">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="senha" required>
                </div>
                
                <div id="mensagem-erro" class="alert alert-danger d-none" role="alert">
                    E-mail ou senha incorretos!
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-4">Entrar</button>
            </form>

            <hr class="mb-4">
            <div class="text-center">
                <p class="text-muted mb-2">Ainda não tem cadastro?</p>
                <a href="cadastro.html" class="btn btn-outline-secondary w-100">Cadastre-se agora</a>
            </div>
            
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
