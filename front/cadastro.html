<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Sistema de Monitorias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh; padding: 20px;">

    <div class="card shadow" style="width: 100%; max-width: 600px;">
        <div class="card-body p-5 d-flex flex-column justify-content-between" style="min-height: 550px;">
            <h3 class="text-center mb-4">Cadastrar</h3>

            <form id="form-cadastro">
                <div id="passo-1" class="step-container">
                    <h5 class="mb-3 text-primary">Passo 1 de 3: Dados Pessoais</h5>

                    <div class="mb-3">
                        <label class="form-label">Nome Completo</label>
                        <input type="text" class="form-control" id="nome" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Data de Nascimento</label>
                        <input type="date" class="form-control" id="dataNascimento" required>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="login.html" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="button" class="btn btn-primary" onclick="irParaPasso(2)">Continuar</button>
                    </div>
                </div>

                <div id="passo-2" class="step-container d-none">
                    <h5 class="mb-3 text-primary">Passo 2 de 3: Vínculo Acadêmico</h5>

                    <div class="mb-3">
                        <label class="form-label">Curso</label>
                        <select class="form-select" id="cursoId" required>
                            <option value="" disabled selected>Selecione o curso</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Matrícula</label>
                        <input type="text" class="form-control" id="matricula" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Tipo de Usuário</label>
                        <select class="form-select" id="tipoUsuario" onchange="verificarTipoMonitor()" required>
                            <option value="ALUNO">Aluno</option>
                            <option value="MONITOR">Monitor</option>
                        </select>
                    </div>

                    <div class="mb-4 d-none" id="div-codigo-monitor">
                        <label class="form-label">Código de Validação do Monitor</label>
                        <input type="text" class="form-control" id="codigoDeValidacao" placeholder="Ex: MONITOR123">
                    </div>

                    <!-- lista de disciplinas 
                    -->

                    <div class="d-flex justify-content-between">
                        <button type="button" class="btn btn-outline-secondary" onclick="irParaPasso(1)">Voltar</button>
                        <button type="button" class="btn btn-primary" onclick="irParaPasso(3)">Continuar</button>
                    </div>
                </div>

                <div id="passo-3" class="step-container d-none">
                    <h5 class="mb-3 text-primary">Passo 3 de 3: Segurança</h5>

                    <div class="mb-3">
                        <label class="form-label">Senha</label>
                        <input type="password" class="form-control" id="senha" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Confirme a Senha</label>
                        <input type="password" class="form-control" id="confirmaSenha" required>
                    </div>

                    <div id="erro-senha" class="alert alert-danger d-none">As senhas não coincidem!</div>

                    <div class="d-flex justify-content-between">
                        <button type="button" class="btn btn-outline-secondary" onclick="irParaPasso(2)">Voltar</button>
                        <button type="submit" class="btn btn-success">Finalizar</button>
                    </div>
                </div>

            </form>
        </div>
    </div>

    <script src="js/cadastro.js"></script>
</body>

</html>
