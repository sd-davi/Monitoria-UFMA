<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Nova Monitoria - Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <a href="home.html" class="btn btn-outline-secondary mb-4">Voltar para Home</a>

                <div class="card shadow-sm">
                    <div class="card-body p-5">
                        <h2 class="fw-bold text-center mb-4" id="titulo-pagina">Criar Nova Monitoria</h2>

                        <form id="formCriarMonitoria">
                            <div class="mb-3">
    <label class="form-label fw-bold">Nome da Monitoria</label>
    <input type="text" id="nome" class="form-control" placeholder="Ex: Turma de Sábado" required>
</div>

<div class="row">
    <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Curso</label>
        <select id="cursoId" class="form-select" required>
            <option value="" disabled selected>Selecione o curso</option>
        </select>
    </div>
    <div class="col-md-6 mb-3">
        <label class="form-label fw-bold">Disciplina</label>
        <select id="idDisciplina" class="form-select" required>
            <option value="" selected disabled>Selecione a disciplina</option>
        </select>
    </div>
</div>

<div class="row">
    <div class="col-md-4 mb-3">
        <label class="form-label fw-bold">Dias da Semana</label>
        <input type="text" id="diasDaSemana" class="form-control" placeholder="Ex: Terça e Quinta" required>
    </div>
    <div class="col-md-4 mb-3">
        <label class="form-label fw-bold">Horário</label>
        <input type="time" id="horario" class="form-control" required>
    </div>
    <div class="col-md-4 mb-4">
        <label class="form-label fw-bold">Link da Sala (Meet)</label>
        <input type="url" id="link" class="form-control" placeholder="https://meet.google.com/..." required>
    </div>
</div>
<div class="form-group">
    <label class="form-label fw-bold">Descrição</label>
    <textarea class="form-control" id="descricao" rows="3"></textarea>
  </div>

<hr class="my-4">
<button type="submit" class="btn btn-primary w-100 fw-bold fs-5" id="botao-salvar">Salvar Monitoria</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/criar-editar-monitoria.js"></script>
</body>
</html>
